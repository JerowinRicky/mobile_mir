name: Android CI/CD Build & Package

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mobile-app:
    name: Build & Package Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Ensure Executable Permissions & Generate Wrapper JAR
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Run Android Unit Tests
        working-directory: ./android
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-mir-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release Bundle (Unsigned/CI Default)
        working-directory: ./android
        run: |
          # Generate fallback keystore for CI release build verification if not provided in secrets
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -v -keystore release.keystore \
              -alias remotedevice -keyalg RSA -keysize 2048 -validity 100 \
              -storepass dummy_store_pass -keypass dummy_key_pass \
              -dname "CN=CI Build, O=MobileMir, C=US"
          fi
          RELEASE_KEYSTORE_PATH="release.keystore" \
          RELEASE_KEYSTORE_PASSWORD="dummy_store_pass" \
          RELEASE_KEY_ALIAS="remotedevice" \
          RELEASE_KEY_PASSWORD="dummy_key_pass" \
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build step completed"

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-mir-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14
