# ============================================================================
# COTURN STUN/TURN RELAY SERVER CONFIGURATION
# ============================================================================

# Network listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Relay port allocation range (UDP & TCP)
min-port=49152
max-port=65535

# Fingerprint in TURN messages (RFC 5389 requirement)
fingerprint

# Ephemeral Time-Limited Credential REST API (Coturn shared secret)
use-auth-secret
static-auth-secret=antigravity-coturn-static-secret-2026
realm=turn.remotedevice.internal

# Nonce lifetime and anti-replay
stale-nonce=600

# Security and isolation hardening
no-multicast-peers
no-cli
no-loopback-peers
no-tcp-relay
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# Logging & Performance
verbose
log-file=stdout
simple-log
